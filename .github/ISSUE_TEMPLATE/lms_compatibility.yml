name: LMS compatibility report
description: Tell us how the module behaves with your LMS — success reports are welcome too.
labels: [compatibility]
body:
  - type: input
    id: lms
    attributes:
      label: LMS and version
      placeholder: Canvas (cloud), Moodle 4.4, Brightspace 20.24...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Module version or commit
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: What did you try?
      options:
        - label: LTI 1.3 launch
        - label: Deep Linking (activity picker)
        - label: AGS grade passback
        - label: Graded assignment deep link (line item)
        - label: LTI 1.1 launch / Basic Outcomes
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything worked
        - Worked with workarounds
        - Something failed
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: LMS settings you needed, workarounds, or what failed (with redacted logs).
